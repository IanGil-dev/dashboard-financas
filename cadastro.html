<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro - Dashboard de Finanças</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app">
    <main class="main auth-page">
        <section class="card auth-card">
            <header class="header">
                <h1>Criar Conta</h1>
                <p>Cadastre-se para começar a usar o Dashboard de Finanças</p>
            </header>
            <form id="form-cadastro">
                <input type="text" id="nome" placeholder="Nome completo" required>
                <input type="email" id="email" placeholder="E-mail" required>
                <input type="password" id="senha" placeholder="Senha" required>
                <button type="submit">Cadastrar</button>
            </form>
            <p id="mensagem-cadastro"></p>
            <p>Já possui uma conta? <a href="login.html">Faça login</a></p>
        </section>
    </main>
</div>
    <div class="app">
        <main class="main">
            <header class="header">
                <h1>Criar Conta</h1>
                <p>Cadastre-se para começar a usar o Dashboard de Finanças</p>
            </header>
            <section class="card">
                <form id="form-cadastro">
                    <input type="text" id="nome" placeholder="Nome completo" required>
                    <input type="email" id="email" placeholder="E-mail" required>
                    <input type="password" id="senha" placeholder="Senha" required>
                    <button type="submit">Cadastrar</button>
                </form>
                <p id="mensagem-cadastro"></p>
                <p>Já possui uma conta? <a href="login.html">Faça login</a></p>
            </section>
        </main>
    </div>
    <script src="cadastro.js"></script>
</body>
</html>
