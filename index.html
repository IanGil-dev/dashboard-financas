<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Finanças Pessoais</title>
    <link rel="icon" href="devico.ico" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app">

        <!-- Sidebar -->
        <aside class="sidebar reveal">
            <div class="logo">
                <span class="logo-icon">💜</span>
                <span>Finança+</span>
            </div>
            <nav class="menu">
                <a href="#resumo" class="menu-item ativo">🏠 Dashboard</a>
                <a href="#form-transacao" class="menu-item">➕ Nova Transação</a>
                <a href="#lista-transacoes" class="menu-item">📋 Transações</a>
                <a href="#graficos" class="menu-item">📊 Gráficos</a>
            </nav>
        </aside>

        <!-- Conteúdo principal -->
        <main class="main">

            <header class="header reveal">
                <h1>Dashboard de Finanças Pessoais</h1>
                <p>Controle de suas despesas de forma simples</p>
            </header>

            <section class="resumo" id="resumo">
                <div class="card saldo-destaque">
                    <h3>Saldo Atual</h3>
                    <p id="total-saldo">R$ 0,00</p>
                </div>
                <div class="card receita">
                    <h3>Receitas</h3>
                    <p id="total-receitas">R$ 0,00</p>
                </div>
                <div class="card despesa">
                    <h3>Despesas</h3>
                    <p id="total-despesas">R$ 0,00</p>
                </div>
            </section>

            <section class="form-transacao reveal" id="form-transacao">
                <h2>Nova Transação</h2>
                <form id="form">
                    <input type="text" id="descrição" placeholder="Descrição" required>
                    <input type="number" id="valor" placeholder="Valor" step="0.01" required>
                    <select id="tipo">
                        <option value="receita">Receita</option>
                        <option value="despesa">Despesa</option>
                    </select>
                    <select id="categoria">
                        <option value="alimentacao">Alimentação</option>
                        <option value="transporte">Transporte</option>
                        <option value="moradia">Moradia</option>
                        <option value="lazer">Lazer</option>
                        <option value="saude">Saúde</option>
                        <option value="salario">Salário</option>
                        <option value="outros">Outros</option>
                    </select>
                    <button type="submit">Adicionar</button>
                </form>
            </section>

            <section class="lista-transacoes reveal" id="lista-transacoes">
                <h2>Transações</h2>
                <ul id="lista">
                    <!-- Onde as transações aparecem -->
                </ul>
            </section>

            <section class="graficos" id="graficos">
                <h2>Gráficos</h2>
                <div class="graficos-grid">
                    <div class="grafico-container reveal">
                        <canvas id="grafico-linha"></canvas>
                    </div>
                    <div class="grafico-container reveal">
                        <canvas id="grafico-barras"></canvas>
                    </div>
                    <div class="grafico-container grafico-pizza reveal">
                        <canvas id="grafico-pizza"></canvas>
                    </div>
                </div>
            </section>

            <footer class="footer">
                <p>&copy; Desenvolvido por Dev Ian</p>
            </footer>

        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>
</body>
</html>
