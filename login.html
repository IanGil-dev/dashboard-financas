<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login - Dashboard de Finanças</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app">
    <main class="main auth-page">
        <section class="card auth-card">
            <header class="header">
                <h1>Fazer Login</h1>
                <p>Entre com seu login e senha para acessar o Dashboard</p>
            </header>
            <form id="form-login">
                <input type="email" id="email" placeholder="E-mail" required>
                <input type="password" id="senha" placeholder="Senha" required>
                <button type="submit">Entrar</button>
            </form>
            <p id="mensagem-login"></p>
            <p>Não tem uma conta? <a href="cadastro.html">Cadastre-se</a></p>
        </section>
    </main>
</div>

    <div class="app">
        <main class="main">

                <h1>Fazer Login</h1>

            </section>
        </main>
    </div>
    <script src="login.js"></script>
</body>
</html>
